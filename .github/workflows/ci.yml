name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  SECRET_KEY: ci-secret-key-only-for-tests-0123456789abcdef
  DATABASE_URL: sqlite:///./ci.db
  # FONTE ÚNICA da versão de plataforma do CI. Estavam repetidas em 6 e 5
  # lugares; o gate `test_versao_de_plataforma.py` compara estes dois valores
  # com os Dockerfiles e com o `relock.sh`, para um PR que suba só a imagem
  # falhar dizendo o que falta em vez de passar entregando um ambiente misto.
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run lint
        run: |
          ruff check backend
          # NOTA: `ruff format --check` ainda não entra aqui — o código nunca foi
          # formatado com ele e o check reprovaria ~180 arquivos. Formatar tudo
          # deve ser um commit isolado, não misturado a correções.
      - name: Audit dependencies (pip)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
      # O `requirements.txt` compilado é o que a imagem instala (ver
      # backend/Dockerfile). Se ele não bater com o `requirements.in`, o
      # ambiente testado aqui não é o que vai para produção — e a divergência
      # apareceria só no deploy.
      #
      # O `pip-compile` roda EM CIMA do compilado versionado, e não num arquivo
      # novo: sem o arquivo de saída presente, o pip-tools perde as preferências
      # de versão e reresolve tudo para o mais recente do PyPI — o gate ficaria
      # vermelho a cada release de transitiva, sem uma linha de código ter mudado.
      # `pip-tools` sai do requirements-dev.txt, onde está FIXADO, pela mesma
      # razão: instalado sem versão, ele próprio é uma fonte de vermelho
      # espontâneo.
      #
      # Desde que o layout virou `.in` -> `.txt` (2026-08-24), o Dependabot
      # regenera o compilado sozinho e não reprova mais aqui. Este passo agora
      # protege contra o caso humano: alguém editar o `requirements.in` e
      # esquecer de recompilar.
      - name: Compilado de dependências em dia
        run: |
          cd backend
          pip-compile --output-file=requirements.txt --strip-extras --quiet requirements.in
          git diff --exit-code -- requirements.txt || {
            echo "::error::requirements.txt (compilado) desatualizado — rode 'scripts/relock.sh' na raiz do repositório e commite o resultado"
            exit 1
          }
      - name: Run tests (SQLite) + cobertura
        run: |
          cd backend && python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Validate migrations + no schema drift (SQLite)
        run: |
          cd backend
          DATABASE_URL=sqlite:///./mig_ci.db python -m alembic upgrade head
          DATABASE_URL=sqlite:///./mig_ci.db python -m alembic check

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf4
          POSTGRES_PASSWORD: cf4
          POSTGRES_DB: cf4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
      TEST_DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run migrations (Postgres)
        run: |
          cd backend && python -m alembic upgrade head
      - name: Check for schema drift (Postgres)
        run: |
          cd backend && python -m alembic check
      - name: Run tests (Postgres)
        run: |
          cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend && npm ci
      - name: Run lint
        run: |
          cd frontend && npm run lint
      # `tsc -b`, não `tsc --noEmit`: o tsconfig da raiz tem `"files": []` e só
      # referências de projeto, então `--noEmit` sozinho não checa arquivo
      # nenhum e passa sempre — um verde falso que já enganou uma auditoria.
      - name: Typecheck
        run: |
          cd frontend && npm run typecheck
      # Gate com allowlist JUSTIFICADA (frontend/scripts/audit-gate.mjs): falha
      # em qualquer high/critical, exceto os advisories com decisão de risco
      # registrada e data de revisão — que, ao vencer, voltam a falhar.
      - name: Audit dependencies (npm)
        run: |
          cd frontend && npm run audit
      - name: Run tests + cobertura
        run: |
          cd frontend && npx vitest run --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: Run build
        run: |
          cd frontend && npm run build

  # api.gen.ts é COMMITADO e gerado a partir do OpenAPI do backend. Sem esta
  # checagem ele diverge em silêncio e os tipos do frontend passam a mentir.
  # Job próprio porque precisa de Python E Node — o job `frontend` não instala
  # Python, e o `backend` não instala Node.
  typegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci
      - name: Regenerar e comparar
        run: |
          cd frontend && npm run typegen
          git diff --exit-code -- src/types/api.gen.ts || {
            echo "::error::src/types/api.gen.ts está desatualizado — rode 'npm run typegen' e commite"
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend && npx playwright install --with-deps chromium
      # `npm run test:e2e` e não `npx playwright test`: é o wrapper
      # (`frontend/scripts/e2e.mjs`) que precisa ser o caminho exercitado. Um
      # script que o CI não roda é um script que ninguém sabe se funciona — foi
      # exatamente assim que o `smoke_prod` apodreceu por uma onda inteira.
      # `E2E_PYTHON` porque aqui as dependências são instaladas no Python global,
      # sem venv.
      - name: E2E (o wrapper sobe backend + frontend)
        working-directory: frontend
        timeout-minutes: 15
        env:
          E2E_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # O MESMO gate no Windows, e o que ele mede é o encerramento.
  #
  # A suíte E2E de desenvolvimento travou no Windows três auditorias seguidas:
  # os specs passavam e o comando não devolvia o terminal. Foi corrigida duas
  # vezes e voltou as duas, porque o CI só roda Linux — onde o defeito não
  # existe — e um gate que ninguém consegue rodar até o fim deixa de ser rodado.
  # `timeout-minutes` é o coração deste job: se `npm run test:e2e` pendurar de
  # novo, ele reprova em vez de gastar as 6 h do padrão.
  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Sem `--with-deps`: instalar dependências de sistema só existe no Ubuntu.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium
      - name: E2E no Windows (tem de ENCERRAR)
        working-directory: frontend
        timeout-minutes: 20
        env:
          E2E_PYTHON: python
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-windows
          path: frontend/playwright-report/

  # Stack REAL do Compose (nginx + backend production + Postgres) com os dois
  # gates que só existem aqui: o smoke da jornada completa e a suíte `e2e-prod`.
  #
  # Este job existe por causa de um achado da auditoria: o `smoke_prod.py` ficou
  # QUEBRADO por uma onda inteira — batia em rotas de cartão/financiamento que o
  # ADR 0021 moveu para `/me/...` — e ninguém percebeu, porque nada o executava.
  # Um gate de deploy que só roda quando alguém lembra apodrece em silêncio, e o
  # dia em que ele é lembrado é o dia do deploy.
  prod-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # Mesmas variáveis do .env de teste local. COOKIE_SECURE=True de propósito:
      # é o valor de produção, e o Chrome trata localhost como contexto seguro,
      # então o cookie funciona sobre http sem afrouxar a configuração.
      - name: Preparar .env do stack
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=cf4
          POSTGRES_DB=controle_financeiro
          POSTGRES_PASSWORD=ci-postgres-only-for-tests
          SECRET_KEY=ci-secret-key-only-for-tests-0123456789abcdef
          APP_ENV=production
          COOKIE_SECURE=True
          HTTP_PORT=8890
          FRONTEND_URL=http://localhost:8890
          ALLOWED_HOSTS=localhost,127.0.0.1
          RATE_LIMIT_ENABLED=True
          SUPERADMIN_EMAIL=smoke-admin@example.com
          ENV
      - name: Subir o stack
        run: |
          docker compose up -d --build
          # `--wait` não serve: o healthcheck do frontend depende do backend, e
          # queremos o log do backend se ele não subir (o `alembic upgrade head`
          # roda aí, antes do uvicorn).
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8890/api/v1/health >/dev/null 2>&1; then
              echo "stack no ar"; exit 0
            fi
            sleep 5
          done
          echo "::error::stack não respondeu em 5 minutos"
          docker compose logs --tail=100
          exit 1
      - name: Smoke de produção (jornada completa)
        run: |
          pip install httpx
          python scripts/smoke_prod.py
      - name: Suíte e2e-prod (nginx + WebSocket + convite por link)
        run: |
          cd frontend && npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.prod.config.ts
      - name: Logs do stack quando falha
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-prod-report
          path: frontend/playwright-report/
