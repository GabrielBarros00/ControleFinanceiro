name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  SECRET_KEY: ci-secret-key-only-for-tests-0123456789abcdef
  DATABASE_URL: sqlite:///./ci.db

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff
      - name: Run lint
        run: |
          ruff check backend
      - name: Run tests (SQLite)
        run: |
          cd backend && python -m pytest -q
      - name: Validate migration chain (SQLite)
        run: |
          cd backend && DATABASE_URL=sqlite:///./mig_ci.db python -m alembic upgrade head

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf4
          POSTGRES_PASSWORD: cf4
          POSTGRES_DB: cf4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
      TEST_DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run migrations (Postgres)
        run: |
          cd backend && python -m alembic upgrade head
      - name: Run tests (Postgres)
        run: |
          cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend && npm install
      - name: Run lint
        run: |
          cd frontend && npm run lint
      - name: Run tests
        run: |
          cd frontend && npm test
      - name: Run build
        run: |
          cd frontend && npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend && npm install
      - name: Install Playwright browsers
        run: |
          cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests (Playwright sobe backend + frontend)
        run: |
          cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
