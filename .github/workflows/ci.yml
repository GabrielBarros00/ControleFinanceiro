name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  SECRET_KEY: ci-secret-key-only-for-tests-0123456789abcdef
  DATABASE_URL: sqlite:///./ci.db

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run lint
        run: |
          ruff check backend
          # NOTA: `ruff format --check` ainda não entra aqui — o código nunca foi
          # formatado com ele e o check reprovaria ~180 arquivos. Formatar tudo
          # deve ser um commit isolado, não misturado a correções.
      - name: Audit dependencies (pip)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
      - name: Run tests (SQLite) + cobertura
        run: |
          cd backend && python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Validate migrations + no schema drift (SQLite)
        run: |
          cd backend
          DATABASE_URL=sqlite:///./mig_ci.db python -m alembic upgrade head
          DATABASE_URL=sqlite:///./mig_ci.db python -m alembic check

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cf4
          POSTGRES_PASSWORD: cf4
          POSTGRES_DB: cf4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
      TEST_DATABASE_URL: postgresql://cf4:cf4@localhost:5432/cf4_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run migrations (Postgres)
        run: |
          cd backend && python -m alembic upgrade head
      - name: Check for schema drift (Postgres)
        run: |
          cd backend && python -m alembic check
      - name: Run tests (Postgres)
        run: |
          cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend && npm ci
      - name: Run lint
        run: |
          cd frontend && npm run lint
      - name: Audit dependencies (npm)
        run: |
          cd frontend && npm audit --omit=dev --audit-level=high
      - name: Run tests + cobertura
        run: |
          cd frontend && npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - name: Run build
        run: |
          cd frontend && npm run build

  # api.gen.ts é COMMITADO e gerado a partir do OpenAPI do backend. Sem esta
  # checagem ele diverge em silêncio e os tipos do frontend passam a mentir.
  # Job próprio porque precisa de Python E Node — o job `frontend` não instala
  # Python, e o `backend` não instala Node.
  typegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci
      - name: Regenerar e comparar
        run: |
          cd frontend && npm run typegen
          git diff --exit-code -- src/types/api.gen.ts || {
            echo "::error::src/types/api.gen.ts está desatualizado — rode 'npm run typegen' e commite"
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci
      - name: Install Playwright browsers
        run: |
          cd frontend && npx playwright install --with-deps chromium
      - name: Run E2E tests (Playwright sobe backend + frontend)
        run: |
          cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
