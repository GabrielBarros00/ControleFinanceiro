version: 2
updates:
  # Dependências Python do backend
  #
  # O par é `requirements.in` (fonte) -> `requirements.txt` (compilado pelo
  # pip-compile). Essa ordem de nomes não é estética: o Dependabot só reconhece
  # um arquivo como saída de pip-compile se ele terminar em `.txt` E existir um
  # `.in` de mesmo nome-base — é o `PipCompileFileMatcher` do dependabot-core.
  #
  # Antes de 2026-08-24 o par era `requirements.txt` -> `requirements.lock`, que
  # reprovava na primeira condição. O Dependabot mexia na fonte, deixava o
  # compilado para trás, e o gate do CI reprovava o PR por uma lacuna de
  # ferramenta. Cada PR de dependência Python precisava de um `pip-compile` à
  # mão — foi o que aconteceu nos PRs #37, #38, #40 e #41, todos com um segundo
  # commit humano só para regenerar. Com o layout atual ele recompila sozinho.
  #
  # O agrupamento SOBREVIVEU à correção, mas por outro motivo: o compilado é um
  # arquivo só, e cinco PRs mexendo nele se atropelam em conflito de merge. Um
  # grupo transforma isso em um PR e uma recompilação.
  #
  # MAJOR fica FORA do grupo, de propósito. Foi a lição do #49: um bump de
  # FastAPI mudou onde as rotas ficam guardadas e cegou quatro varreduras de
  # segurança do projeto, escondido no meio de outras onze atualizações
  # inofensivas. Sozinho num PR, um bump desses é lido com a atenção que pede.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dependências npm do frontend
  #
  # Agrupadas por tipo: quebrar uma dependência de RUNTIME derruba o app; uma de
  # desenvolvimento (vitest, playwright, tipos) no máximo derruba o CI, e pode
  # ser revisada em lote sem o mesmo cuidado. Major fora do grupo pela mesma
  # razão do pip.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-prod:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      frontend-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Actions do GitHub usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Imagens base dos Dockerfiles
  #
  # Faltava, e a lacuna era silenciosa: `python:3.12-slim` (backend),
  # `node:22-alpine` e `nginx:alpine` (frontend) nunca recebiam correção de
  # segurança por aqui. O `pip-audit` do CI olha as dependências Python, não o
  # sistema operacional debaixo delas — uma CVE em openssl na imagem base não
  # aparecia em gate nenhum, e isto está em produção.
  #
  # Major PASSA, inclusive Python e Node. Não passava com segurança até agora:
  # a versão estava repetida em 6 lugares no ci.yml, no Dockerfile e no
  # `relock.sh`, e um PR que subisse só a imagem ficava VERDE — o CI continuava
  # instalando o Python antigo pelo `setup-python`, e o que ia para produção era
  # uma imagem nova rodando um `requirements.txt` resolvido para a versão velha.
  #
  # O que destravou foi `backend/tests/test_versao_de_plataforma.py`: as versões
  # agora saem de `env.PYTHON_VERSION`/`env.NODE_VERSION` no ci.yml, o
  # `relock.sh` lê a dele do Dockerfile, e o gate reprova qualquer PR em que os
  # lugares discordem — dizendo quais. O PR incompleto falha em vez de mentir, e
  # o completo é testado de verdade no Python novo.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Imagens do docker-compose
  #
  # Ecossistema SEPARADO do `docker` acima: aquele lê Dockerfile, este lê
  # docker-compose.yml. Configurar só o primeiro deixaria o `postgres:16-alpine`
  # do compose sem atualização nenhuma — que é o banco do desenvolvimento e o
  # mesmo major que roda em produção.
  #
  # `cloudflare/cloudflared:latest` e `dpage/pgadmin4` (sem tag) não têm versão
  # para comparar; o Dependabot os ignora sozinho, e é por isso que não estão
  # numa lista de exceção aqui.
  #
  # O ÚNICO major bloqueado do repositório, e só o do Postgres.
  #
  # Aqui nenhum gate resolve, porque o problema não é código: subir o major do
  # Postgres troca o formato do diretório de dados. O volume
  # `controlefinanceiro_postgres_data` em produção foi inicializado pelo 16; um
  # container 18 apontado para ele não migra nada — recusa-se a subir com
  # "database files are incompatible with server". O CI passaria com folga,
  # porque lá o banco nasce vazio a cada execução; quem quebra é o deploy.
  #
  # Subir exige pg_dump antes, restore depois e janela de indisponibilidade.
  # É tarefa planejada, não merge de PR — e por isso o PR nem chega.
  # As outras imagens do compose (cloudflared, pgadmin) usam `latest`/sem tag e
  # não têm versão para comparar; o Dependabot as ignora sozinho.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
    groups:
      compose-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
