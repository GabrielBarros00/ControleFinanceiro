services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cf4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-controle_financeiro}
    volumes:
      # `/var/lib/postgresql`, NÃO `/var/lib/postgresql/data`. O ponto de
      # montagem mudou no Postgres 18: a imagem passou a guardar os dados num
      # subdiretório versionado e recusa-se a subir se o volume for montado no
      # caminho antigo, saindo com código 1 antes de qualquer healthcheck —
      # "The suggested container configuration for 18+ is to place a single
      # mount at /var/lib/postgresql". O motivo é permitir `pg_upgrade --link`
      # sem cruzar fronteira de mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # `-h 127.0.0.1` NÃO é enfeite: sem ele este healthcheck dá verde ANTES de
      # o banco existir, e o deploy novo falha.
      #
      # Na PRIMEIRA subida (volume vazio) o entrypoint do Postgres roda o
      # `initdb` e então levanta um servidor TEMPORÁRIO, só no socket Unix, para
      # aplicar a inicialização. O `pg_isready` sem `-h` fala por esse socket e
      # responde "aceitando conexões" — o compose marca o serviço `healthy`, o
      # backend começa o `alembic upgrade head` e leva
      # `FATAL: the database system is starting up`, porque o servidor de
      # verdade ainda não subiu. Com `-h 127.0.0.1` a checagem passa pelo TCP,
      # que é exatamente por onde o backend conecta, e só fica verde quando há
      # de fato um banco atendendo.
      #
      # Reproduzido com `down -v` seguido de `up`: o backend caía em laço, era
      # marcado `unhealthy` e derrubava junto o `frontend` e o `cron`
      # ("dependency failed to start"). Some em máquina rápida e aparece na
      # lenta — que é a máquina de um deploy caseiro.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-cf4} -d ${POSTGRES_DB:-controle_financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Fuso do RELÓGIO do processo (logs, cron).
      TZ: ${TZ:-America/Sao_Paulo}
      # Fuso do CALENDÁRIO do app: que dia é "hoje" e onde um mês começa e
      # termina. `TZ` sozinho não bastava — ele muda o fuso do processo, mas
      # metade do código perguntava as horas em UTC explicitamente
      # (`datetime.now(UTC)`) e a outra metade em local (`date.today()`), então
      # entre 21h e meia-noite do último dia do mês em Brasília as duas
      # discordavam: o resumo apontava o mês seguinte (zerado) enquanto o
      # extrato mostrava o corrente, na mesma tela. Agora a referência é única e
      # explícita, e vale também para quem roda o backend fora do compose.
      APP_TIMEZONE: ${APP_TIMEZONE:-${TZ:-America/Sao_Paulo}}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cf4}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-controle_financeiro}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      # Ajustes operacionais que o Settings declara como configuráveis. Mantê-los
      # explícitos aqui é o que faz uma alteração no `.env` realmente chegar ao
      # processo; `tests/test_compose_env.py` impede novas omissões silenciosas.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      SQL_ECHO: ${SQL_ECHO:-False}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES:-30}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      RESET_TOKEN_EXPIRES_MINUTES: ${RESET_TOKEN_EXPIRES_MINUTES:-30}
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-4.0}
      IOF_INTERNATIONAL_CARD_RATE: ${IOF_INTERNATIONAL_CARD_RATE:-0.035}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Em produção (APP_ENV=production) é OBRIGATÓRIO: o backend recusa subir com
      # "*"/vazio. Fixe o(s) domínio(s) reais (ex.: app.seudominio.com). localhost
      # é sempre permitido internamente (healthcheck do container).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Para onde vai a resposta de quem aperta "responder". O EMAIL_FROM é um
      # noreply@ num subdomínio de envio que costuma não ter MX: a resposta
      # morre no DNS e ninguém fica sabendo que tentaram falar com você.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # True usa STARTTLS (normalmente porta 587). False significa SMTP sem
      # STARTTLS, útil apenas para um relay confiável. SSL implícito (465/2465)
      # também é suportado — o modo vem da porta e do que o servidor anuncia.
      SMTP_TLS: ${SMTP_TLS:-True}
      # Aviso de vencimento (ADR 0033). Sem o par VAPID a funcionalidade se
      # desliga sozinha: a interface não oferece push, e o sino e o e-mail
      # seguem funcionando. Gere com `python scripts/gerar_vapid.py`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Quem usa esta hora é o serviço `cron`, não o backend — mas ela é campo
      # do `Settings`, e o gate `test_compose_env` exige que TODO campo
      # configurável chegue ao backend. A regra é boa: um campo que só existe
      # num serviço vira configuração fantasma, que a pessoa muda no .env e não
      # entende por que não teve efeito.
      DUE_REMINDER_HOUR: ${DUE_REMINDER_HOUR:-9}
      # Primeiro superadministrador (ADR 0026). Obrigatório em produção: é a
      # única conta que se cadastra sem convite no primeiro acesso, e o backend
      # RECUSA subir sem ela.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?defina SUPERADMIN_EMAIL no .env}
      # As quatro abaixo são o DEGRAU DO MEIO da cascata de configuração
      # (`AppSetting` → `.env` → embutido, ver app/services/app_settings.py).
      # Ficavam de fora daqui, e o efeito era o mesmo do SMTP_TLS acima: o
      # operador preenchia a variável no `.env`, reiniciava, e nada acontecia —
      # o container nunca a recebia e o backend caía no padrão embutido. Sem
      # elas, "ausência de linha significa acompanhe o ambiente" não passava de
      # uma frase, porque não havia ambiente a acompanhar.
      #
      # Os valores padrão espelham `backend/app/core/config.py` de propósito, e
      # `tests/test_compose_env.py` reprova quem mudar um lado só.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite_only}
      ATTACHMENT_QUOTA_BYTES: ${ATTACHMENT_QUOTA_BYTES:-209715200}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-5000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-True}
      # Tetos do rate limit de auth, por MINUTO. O de IP protege contra varredura
      # e cadastro em massa; o de CONTA é o que barra força bruta num alvo, e é
      # ele que não depende de quantos IPs o atacante tem. Ver app/core/rate_limit.
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_PER_MINUTE:-10}
      # Quem o uvicorn aceita como proxy para ler `X-Forwarded-For`. Default do
      # Dockerfile = faixas privadas (a rede do Compose). Só mexa aqui se o
      # backend estiver atrás de um proxy fora dessas faixas — abrir demais
      # devolve ao cliente o poder de forjar o próprio IP no rate limit.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      # Conteúdo dos anexos (ADR 0007): fora do banco, no volume abaixo.
      ATTACHMENT_STORAGE_DIR: /data/attachments
    volumes:
      # ATENÇÃO ao backup: a partir daqui o estado do sistema são DOIS
      # artefatos — o dump do Postgres e este volume. Restaurar só o banco
      # devolve os lançamentos com os recibos quebrados.
      - attachments_data:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      # O container roda `alembic upgrade head` ANTES do uvicorn, e numa base
      # nova são dezenas de revisões. Sem `start_period`, cada falha desse
      # intervalo consome uma das 10 tentativas, e uma máquina lenta gasta a cota
      # inteira antes de o app abrir a porta: o serviço é marcado `unhealthy` e
      # leva `frontend` e `cron` junto. Dentro do `start_period` a falha não
      # conta — é a diferença entre "ainda subindo" e "subiu quebrado".
      start_period: 90s

  # Tarefas periódicas do backend. Reusa a MESMA imagem (mesmo código, mesmas
  # dependências) e roda um laço simples em vez de cron — assim não há um
  # segundo Dockerfile nem crontab para manter em sincronia.
  #
  # Sem este serviço, o store de câmbio só era preenchido pelo caminho
  # preguiçoso, que agora é offline: uma recorrência estrangeira simplesmente
  # não materializava até alguém salvar algo. O backfill mantém o store quente.
  cron:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # O cron toma decisões de calendário e precisa enxergar o mesmo fuso do
      # backend. Sem esta linha, mudar APP_TIMEZONE no `.env` só alterava a API.
      APP_TIMEZONE: ${APP_TIMEZONE:-${TZ:-America/Sao_Paulo}}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cf4}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-controle_financeiro}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      SQL_ECHO: ${SQL_ECHO:-False}
      # O backfill de câmbio roda neste processo, portanto o timeout configurado
      # pelo operador também precisa chegar ao cron.
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-4.0}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # O `cron` carrega o mesmo `Settings` do backend, e a validação de deploy
      # exige esta variável — sem ela o serviço morre no import, em laço.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?defina SUPERADMIN_EMAIL no .env}
      # Quem ENVIA o push é este serviço, não o backend — então o par VAPID
      # precisa chegar aqui. Sem ele o aviso ainda sai no sino; só o push é que
      # não sobe.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Hora LOCAL do aviso. O script roda de hora em hora e sai sem tocar no
      # banco fora dela.
      DUE_REMINDER_HOUR: ${DUE_REMINDER_HOUR:-9}
      # Mesma configuração de anexos do backend. O expurgo de hoje não toca o
      # conteúdo, mas rodar com um ATTACHMENT_STORAGE_DIR diferente do serviço
      # que grava é uma armadilha esperando a primeira rotina que toque nele.
      ATTACHMENT_STORAGE_DIR: /data/attachments
    volumes:
      - attachments_data:/data/attachments
    depends_on:
      backend:
        condition: service_healthy
    # Câmbio de hora em hora (barato e idempotente: pula o que já existe);
    # expurgo de auditoria/eventos/sessões uma vez por dia.
    #
    # O aviso de vencimento (ADR 0033) também é chamado de HORA em hora, e não
    # no ramo diário: aquele ramo dispara "24h depois que o contêiner subiu", ou
    # seja, numa hora que depende de quando houve o último deploy. Para expurgo
    # tanto faz; para notificação não — "sua conta vence hoje" às 3 da manhã
    # acorda a pessoa e queima o canal. Quem decide a hora é o script, que sai
    # sem tocar no banco fora da `DUE_REMINDER_HOUR`.
    command: >
      sh -c 'horas=0;
      while true; do
        python scripts/backfill_rates.py 7 || true;
        python scripts/avisar_vencimentos.py || true;
        horas=$$((horas + 1));
        if [ $$horas -ge 24 ]; then
          python scripts/purge_old_records.py 180 || true;
          horas=0;
        fi;
        sleep 3600;
      done'

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # `BIND_ADDR` existe para o deploy com TLS terminado por um proxy no host
      # (Caddy, Traefik, nginx). Sem ele a porta abre em 0.0.0.0 e o aplicativo
      # continua acessível por HTTP puro na porta direta — o TLS na frente vira
      # opcional para quem souber o número da porta, e o cookie `Secure` viaja
      # numa conexão que não é segura. Com `BIND_ADDR=127.0.0.1`, só o proxy
      # local alcança. O padrão segue 0.0.0.0 para não quebrar quem publica
      # direto na 80 sem proxy nenhum.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    # É o ÚNICO container exposto ao host: sem healthcheck, um nginx que subiu
    # mas não serve deixa o stack "up" e o usuário sem app, sem sinal nenhum.
    healthcheck:
      # 127.0.0.1, não `localhost`: o nginx da imagem escuta `listen 80` (IPv4) e
      # não `listen [::]:80`. Com IPv6 no container, `localhost` resolve para ::1
      # primeiro, o wget falha e o serviço saudável aparece como `unhealthy`.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
      # ENDEREÇO FIXO, e não por capricho: sem ele o Tunnel nunca sobe.
      #
      # A `cloudflare_edge` é uma /29 — sobram os endereços .2 a .6, porque o .1
      # é o gateway. O IPAM do Docker entrega o PRIMEIRO livre a quem chega sem
      # pedir endereço, e quem chega primeiro é este container: o `cloudflared`
      # espera o healthcheck do frontend (`depends_on`), então perde a corrida
      # por construção. O frontend levava o .2, e logo depois o `cloudflared`
      # pedia o .2 fixo e morria com "failed to set up container networking:
      # Address already in use" — todo o resto do stack `healthy`, e o app
      # inalcançável pelo Tunnel.
      #
      # O .2 não é intercambiável: é o peer que o `nginx.conf` reconhece para
      # aceitar `CF-Connecting-IP` (o `geo $cloudflared_source_trusted`). Quem
      # cede é o frontend.
      cloudflare_edge:
        ipv4_address: 172.31.255.3

  # Opcional: ative com `docker compose --profile cloudflare up --build -d`.
  # O Tunnel alcança a porta interna 8080 do nginx pela rede dedicada. O nginx
  # só confia em CF-Connecting-IP quando o peer é o IP fixo deste container.
  cloudflared:
    # A ÚNICA imagem sem versão fixada no projeto, e é de propósito. Todas as
    # outras foram pinadas em 2026-08-24; esta ficou porque o cloudflared não é
    # uma dependência do app, é o cliente de um serviço remoto: a Cloudflare
    # deprecia versões antigas do túnel, e um cliente velho perde a conexão com
    # a edge — o app fica inalcançável sem nada no stack parecer errado.
    #
    # `pull_policy: always` é o que fecha o par: sem ele, `:latest` seria só a
    # imagem que por acaso está no disco, o pior dos dois mundos.
    image: cloudflare/cloudflared:latest
    # `--no-autoupdate` evita que o processo altere a própria imagem; o update
    # acontece de forma reproduzível no `docker compose up`, puxando antes de
    # recriar o container (recomendação oficial para cloudflared em Docker).
    pull_policy: always
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      cloudflare_edge:
        ipv4_address: 172.31.255.2

  # Ferramenta de administração do banco — apenas em desenvolvimento
  # (docker compose --profile dev up)
  pgadmin:
    image: dpage/pgadmin4:9.17
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  attachments_data:

networks:
  cloudflare_edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/29
