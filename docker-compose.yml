services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cf4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-controle_financeiro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cf4} -d ${POSTGRES_DB:-controle_financeiro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Fuso do RELÓGIO do processo (logs, cron).
      TZ: ${TZ:-America/Sao_Paulo}
      # Fuso do CALENDÁRIO do app: que dia é "hoje" e onde um mês começa e
      # termina. `TZ` sozinho não bastava — ele muda o fuso do processo, mas
      # metade do código perguntava as horas em UTC explicitamente
      # (`datetime.now(UTC)`) e a outra metade em local (`date.today()`), então
      # entre 21h e meia-noite do último dia do mês em Brasília as duas
      # discordavam: o resumo apontava o mês seguinte (zerado) enquanto o
      # extrato mostrava o corrente, na mesma tela. Agora a referência é única e
      # explícita, e vale também para quem roda o backend fora do compose.
      APP_TIMEZONE: ${APP_TIMEZONE:-${TZ:-America/Sao_Paulo}}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cf4}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-controle_financeiro}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Em produção (APP_ENV=production) é OBRIGATÓRIO: o backend recusa subir com
      # "*"/vazio. Fixe o(s) domínio(s) reais (ex.: app.seudominio.com). localhost
      # é sempre permitido internamente (healthcheck do container).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # SMTP_TLS estava documentado no .env.example e no SETUP.md, era lido pelo
      # `Settings` — e não chegava aqui. Quem precisasse de `False` (porta 465
      # com SSL implícito, relay local sem TLS) preenchia o campo e nada
      # acontecia: o container continuava tentando STARTTLS e o envio falhava
      # sem que a configuração explicasse por quê.
      SMTP_TLS: ${SMTP_TLS:-True}
      # Primeiro superadministrador (ADR 0026). Obrigatório em produção: é a
      # única conta que se cadastra sem convite no primeiro acesso, e o backend
      # RECUSA subir sem ela.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?defina SUPERADMIN_EMAIL no .env}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-True}
      # Tetos do rate limit de auth, por MINUTO. O de IP protege contra varredura
      # e cadastro em massa; o de CONTA é o que barra força bruta num alvo, e é
      # ele que não depende de quantos IPs o atacante tem. Ver app/core/rate_limit.
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      RATE_LIMIT_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_PER_MINUTE:-10}
      # Quem o uvicorn aceita como proxy para ler `X-Forwarded-For`. Default do
      # Dockerfile = faixas privadas (a rede do Compose). Só mexa aqui se o
      # backend estiver atrás de um proxy fora dessas faixas — abrir demais
      # devolve ao cliente o poder de forjar o próprio IP no rate limit.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
      # Conteúdo dos anexos (ADR 0007): fora do banco, no volume abaixo.
      ATTACHMENT_STORAGE_DIR: /data/attachments
    volumes:
      # ATENÇÃO ao backup: a partir daqui o estado do sistema são DOIS
      # artefatos — o dump do Postgres e este volume. Restaurar só o banco
      # devolve os lançamentos com os recibos quebrados.
      - attachments_data:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tarefas periódicas do backend. Reusa a MESMA imagem (mesmo código, mesmas
  # dependências) e roda um laço simples em vez de cron — assim não há um
  # segundo Dockerfile nem crontab para manter em sincronia.
  #
  # Sem este serviço, o store de câmbio só era preenchido pelo caminho
  # preguiçoso, que agora é offline: uma recorrência estrangeira simplesmente
  # não materializava até alguém salvar algo. O backfill mantém o store quente.
  cron:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cf4}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-controle_financeiro}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # O `cron` carrega o mesmo `Settings` do backend, e a validação de deploy
      # exige esta variável — sem ela o serviço morre no import, em laço.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?defina SUPERADMIN_EMAIL no .env}
      # Mesma configuração de anexos do backend. O expurgo de hoje não toca o
      # conteúdo, mas rodar com um ATTACHMENT_STORAGE_DIR diferente do serviço
      # que grava é uma armadilha esperando a primeira rotina que toque nele.
      ATTACHMENT_STORAGE_DIR: /data/attachments
    volumes:
      - attachments_data:/data/attachments
    depends_on:
      backend:
        condition: service_healthy
    # Câmbio de hora em hora (barato e idempotente: pula o que já existe);
    # expurgo de auditoria/eventos/sessões uma vez por dia.
    command: >
      sh -c 'horas=0;
      while true; do
        python scripts/backfill_rates.py 7 || true;
        horas=$$((horas + 1));
        if [ $$horas -ge 24 ]; then
          python scripts/purge_old_records.py 180 || true;
          horas=0;
        fi;
        sleep 3600;
      done'

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # `BIND_ADDR` existe para o deploy com TLS terminado por um proxy no host
      # (Caddy, Traefik, nginx). Sem ele a porta abre em 0.0.0.0 e o aplicativo
      # continua acessível por HTTP puro na porta direta — o TLS na frente vira
      # opcional para quem souber o número da porta, e o cookie `Secure` viaja
      # numa conexão que não é segura. Com `BIND_ADDR=127.0.0.1`, só o proxy
      # local alcança. O padrão segue 0.0.0.0 para não quebrar quem publica
      # direto na 80 sem proxy nenhum.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    # É o ÚNICO container exposto ao host: sem healthcheck, um nginx que subiu
    # mas não serve deixa o stack "up" e o usuário sem app, sem sinal nenhum.
    healthcheck:
      # 127.0.0.1, não `localhost`: o nginx da imagem escuta `listen 80` (IPv4) e
      # não `listen [::]:80`. Com IPv6 no container, `localhost` resolve para ::1
      # primeiro, o wget falha e o serviço saudável aparece como `unhealthy`.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ferramenta de administração do banco — apenas em desenvolvimento
  # (docker compose --profile dev up)
  pgadmin:
    image: dpage/pgadmin4
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
  attachments_data:
