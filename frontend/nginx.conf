server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compatível com o limite de upload do backend (UPLOAD_MAX_BYTES = 5MB);
    # o default de 1MB do nginx bloquearia o import de CSV antes do backend
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP do HTML da SPA — a API já manda a dela, mas a página é a superfície
    # real de XSS. 'unsafe-inline' em style-src é exigido pelo Tailwind/Radix
    # (estilos inline de posicionamento); script-src fica sem escape.
    #
    # connect-src 'self' SOZINHO: o spec já resolve ws://ws:// e wss:// do mesmo
    # host a partir de 'self'. Os esquemas curinga `ws: wss:` que estavam aqui
    # liberavam WebSocket para QUALQUER origem — o canal clássico de exfiltração
    # depois de um XSS, e justamente o que o resto desta linha existe para fechar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # WebSocket (tempo real) — precisa dos headers de Upgrade e timeout longo
    location /api/v1/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host preserva a porta — com $host um redirect 307 do backend
        # apontaria para a porta 80 quando HTTP_PORT != 80 e derrubaria a sessão
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API (same-origin: sem CORS, cookies SameSite=Lax funcionam)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
