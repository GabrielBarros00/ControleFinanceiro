# O container cloudflared tem endereço fixo numa rede Docker dedicada. A porta
# 8080, sozinha, NÃO cria confiança: o peer também precisa ser exatamente esse
# container. Assim, publicar 8080 por engano não permite forjar o IP do cliente.
geo $cloudflared_source_trusted {
    default 0;
    172.31.255.2 1;
}

map "$cloudflared_source_trusted:$server_port:$http_cf_connecting_ip" $trusted_client_ip {
    default $remote_addr;
    ~^1:8080:(?<cloudflare_client_ip>.+)$ $cloudflare_client_ip;
}

# O esquema público também só é aceito quando origem e porta conferem.
map "$cloudflared_source_trusted:$server_port:$http_x_forwarded_proto" $trusted_forwarded_proto {
    default $scheme;
    "1:8080:http" http;
    "1:8080:https" https;
}

# Defesa adicional: uma conexão na porta interna que não partiu do container
# cloudflared recebe 403, mesmo que alguém acrescente uma publicação dessa porta.
map "$server_port:$cloudflared_source_trusted" $reject_untrusted_tunnel_request {
    default 0;
    "8080:0" 1;
}

# Cache do service worker e do manifesto.
#
# Os dois PRECISAM ser revalidados a cada visita: um `sw.js` cacheado por horas
# deixa o aparelho da pessoa preso numa versão antiga do worker — e é o worker
# que decide o que mais fica em cache. É a falha de PWA mais difícil de alcançar
# depois, porque o conserto está justamente no arquivo que não é rebuscado.
#
# Feito por `map` + UM `add_header` no nível do server, e não por
# `location = /sw.js { add_header ... }`: no nginx, um `add_header` dentro de um
# bloco DESCARTA todos os herdados do nível acima. Um bloco só para o
# Cache-Control apagaria os cinco headers de segurança (nosniff, X-Frame-Options,
# Referrer-Policy, Permissions-Policy e a CSP) exatamente para o arquivo que tem
# controle sobre todas as requisições do app.
map $uri $cache_control_por_arquivo {
    default "";
    "/sw.js" "no-cache";
    "/manifest.webmanifest" "no-cache";
}

server {
    listen 80;
    listen 8080;
    server_name _;

    if ($reject_untrusted_tunnel_request) {
        return 403;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Compatível com o limite de upload do backend (UPLOAD_MAX_BYTES = 5MB);
    # o default de 1MB do nginx bloquearia o import de CSV antes do backend
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vazio para todo o resto: `add_header` com valor vazio não emite o header.
    add_header Cache-Control $cache_control_por_arquivo always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP do HTML da SPA — a API já manda a dela, mas a página é a superfície
    # real de XSS. 'unsafe-inline' em style-src é exigido pelo Tailwind/Radix
    # (estilos inline de posicionamento); script-src fica sem escape.
    #
    # connect-src 'self' SOZINHO: o spec já resolve ws://ws:// e wss:// do mesmo
    # host a partir de 'self'. Os esquemas curinga `ws: wss:` que estavam aqui
    # liberavam WebSocket para QUALQUER origem — o canal clássico de exfiltração
    # depois de um XSS, e justamente o que o resto desta linha existe para fechar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # WebSocket (tempo real) — precisa dos headers de Upgrade e timeout longo
    location /api/v1/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host preserva a porta — com $host um redirect 307 do backend
        # apontaria para a porta 80 quando HTTP_PORT != 80 e derrubaria a sessão
        proxy_set_header Host $http_host;
        # O WebSocket segue o mesmo contrato de proxy/IP da API HTTP.
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API (same-origin: sem CORS, cookies SameSite=Lax funcionam)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        # SOBRESCREVE, não acrescenta: no Tunnel usa CF-Connecting-IP; no
        # acesso direto continua usando apenas o endereço da conexão.
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
