[tool.pytest.ini_options]
testpaths = ['tests']
python_files = 'test_*.py'
# `app` importável seja qual for a forma de invocar. Só o CI acertava, e por
# acidente: `python -m pytest` põe o diretório atual no `sys.path`, o executável
# `pytest` não. Como `tests/` não é pacote, o pytest inseria `backend/tests` e
# nada mais — então `make backend-test` (que roda `pytest backend` da raiz) e um
# `pytest` solto dentro de `backend/` morriam os dois em
# `ModuleNotFoundError: No module named 'app'`, e o único jeito que funcionava
# era o que o ci.yml usa. Gate que só roda de um jeito é gate que apodrece.
#
# O caminho é relativo à ROOTDIR, que é sempre `backend/` — é onde está este
# arquivo, e é ele que o pytest acha subindo a partir dos argumentos.
pythonpath = ['.']
markers = [
    # Postgres quando TEST_DATABASE_URL aponta para um (leg backend-postgres do
    # CI), SQLite em arquivo senão. As invariantes que dependem de MVCC ficam
    # marcadas com `precisa_de_mvcc` e SÓ valem no primeiro caso: o SQLite admite
    # um escritor por vez e mascara o lê-depois-escreve.
    "concurrency: exercita duas ou mais requisições ao mesmo tempo",
]
filterwarnings = [
    # Conexão de banco que ninguém fechou vira FALHA, não recado no fim da
    # execução. Como aviso, ele sobrevivia a uma suíte verde — e foi assim que
    # dois engines de teste sem `dispose()` ficaram meses escondendo o lugar onde
    # o próximo vazamento apareceria. Se um vazamento de terceiro aparecer aqui,
    # a saída é restringir o `error` (por módulo), não voltar a ignorá-lo.
    "error::ResourceWarning",
    # Deprecação INTERNA do Starlette ao acessar o status 422 no seu próprio
    # exception handler — fora do nosso controle (nosso código já usa o novo nome).
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning",
    # passlib 1.7.4 (sem release desde 2020) lê argon2.__version__, que o
    # argon2-cffi já deprecou. Funciona hoje e vai quebrar quando o atributo for
    # removido — é o motivo de o passlib estar marcado para sair assim que não
    # houver mais hash legado (pbkdf2/bcrypt) no banco. Ver app/core/security.py.
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
]

[tool.ruff.lint]
# EXPLÍCITO de propósito. Este era o default do ruff até a série 0.15, e o
# projeto nunca o escreveu — vivia do default. No 0.16 o default deixou de ser
# esta lista e passou a incluir dezenas de famílias novas (UP, B, I, DTZ, FURB,
# SIM...): `ruff check backend` saltou de 0 para 1876 achados sem uma linha de
# código ter mudado, e o bump de ferramenta virou um PR impossível de revisar.
#
# Fixando aqui, a versão do ruff volta a ser o que deveria ter sido sempre: uma
# atualização de ferramenta, não uma mudança de política de lint. Ampliar o
# conjunto continua possível — mas como decisão deliberada, em commit próprio,
# com os achados lidos um a um.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Migrações geradas e conftest importam modelos após setup de path/config
"alembic/versions/*" = ["E402"]
"alembic/env.py" = ["E402"]
"tests/*" = ["E402"]
