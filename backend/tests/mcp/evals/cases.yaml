  forbidden_tools: [transactions_create, transactions_delete]
  max_calls: 4
  risk: write
  golden:
    - tool: transactions_search
      args: {text: "mercado", date_from: "{ontem}", date_to: "{ontem}"}
      expect: {ok: true, path: "total_count", equals: 1}
      save: {mercado: "items.0.id"}
    - tool: transactions_update
      args: {transaction_id: "{id:mercado}", split_with: ["João"]}
      expect: {ok: true, path: "transaction.my_share", equals: "100.00"}

