  expected_tools: [transactions_create]
  forbidden_tools: [transactions_bulk_delete, statements_pay]
  max_calls: 3
  risk: write
  golden:
    - tool: transactions_create
      args: {idempotency_key: "{uuid}", title: "Gasolina", amount: "89.90", card: "Nubank", category: "Transporte"}
      expect: {ok: true, path: "transaction.card.name", equals: "Nubank"}

