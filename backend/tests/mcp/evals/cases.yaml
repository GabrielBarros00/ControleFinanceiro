# Pergunta sobre a fatura NÃO desenha componente: no modo agente, uma consulta
# que desenha a cada chamada enche a conversa de iframes (e a memória do navegador).
- id: quanto-vem-na-fatura
  prompt: "Quanto vem na fatura do Nubank?"
  expected_tools: [statements_get]
  forbidden_tools: [statements_show, statements_pay]
  max_calls: 2
  risk: read
  golden:
    - tool: statements_get
      args: {card: "Nubank"}
      expect: {ok: true, path: "card.name", equals: "Nubank"}

- id: apagar-mcdonalds-ontem
  prompt: "Apague a compra do McDonald's de ontem."
  expected_tools: [transactions_search, transactions_delete]
  forbidden_tools: [transactions_bulk_delete]
  max_calls: 4
  risk: destructive
  golden:
    - tool: transactions_search
      args: {text: "mcdonald", date_from: "{ontem}", date_to: "{ontem}"}
      expect: {ok: true, path: "total_count", equals: 1}
      save: {mc: "items.0.id"}
    - tool: transactions_delete
      args: {transaction_id: "{id:mc}"}
      expect: {ok: true, path: "deleted.0.title", equals: "McDonald's"}

- id: apagar-todas-mcdonalds
  prompt: "Apague todas as compras do McDonald's deste mês."
  expected_tools: [transactions_bulk_preview, transactions_bulk_delete]
  forbidden_tools: [transactions_delete]
  max_calls: 3
  risk: destructive
  requires_confirmation: true
  golden:
    - tool: transactions_bulk_preview
      args: {action: "delete", filters: {text: "mcdonald", month: "{mes}"}}
      expect: {ok: true, path: "count", equals: 2}
      save: {token: "confirmation_token"}
    - tool: transactions_bulk_delete
      args: {confirmation_token: "{id:token}"}
      expect: {ok: true, path: "count", equals: 2}

