- id: extrato-com-pix-recebido
  prompt: "Importe este extrato do Itaú: 05/09 PIX RECEBIDO JOAO +900,00; 06/09 PADARIA -12,50."
  expected_tools: [imports_preview, imports_commit]
  forbidden_tools: [transactions_create, income_create]
  max_calls: 4
  risk: write
  must_ask_user: true
  golden:
