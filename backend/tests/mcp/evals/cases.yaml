# Agente de TERMINAL (Claude Code, Codex, Gemini CLI): o arquivo não passa pela
# conversa. O link de uso único leva o recibo do disco direto para o app.
- id: anexar-recibo-pelo-terminal
  prompt: "Anexe o recibo ~/Downloads/recibo-mercado.jpg à compra do mercado de ontem."
  expected_tools: [transactions_search, attachments_upload_link]
  forbidden_tools: [transactions_update, transactions_create]
  max_calls: 3
  risk: write
  golden:
    - tool: transactions_search
      args: {text: "mercado", date_from: "{ontem}", date_to: "{ontem}"}
      expect: {ok: true, path: "total_count", equals: 1}
      save: {mercado: "items.0.id"}
    - tool: attachments_upload_link
      args: {transaction_id: "{id:mercado}", file_path: "~/Downloads/recibo-mercado.jpg"}
      expect: {ok: true, path: "form_field", equals: "file"}

# --- Paridade com o app (2026-09-24) ------------------------------------------------

# O caso do relatório de lacunas: itens da nota com divisão por item, parcelado.
- id: nota-com-itens-dividida
  prompt: "Compra no Savegnago de R$ 100 no Nubank em 2x: arroz R$ 30 é meu, shampoo R$ 20 é do João e o refrigerante de R$ 50 dividimos."
  expected_tools: [transactions_create]
  forbidden_tools: [transactions_update, transactions_bulk_delete]
  max_calls: 2
  risk: write
  golden:
    - tool: transactions_create
      args:
        idempotency_key: "{uuid}"
        title: "Savegnago"
        space: "Casa"
        card: "Nubank"
        installments: 2
        items:
          - {title: "Arroz", amount: "30.00", owner: "eu"}
          - {title: "Shampoo", amount: "20.00", owner: "João"}
          - {title: "Refrigerante", amount: "50.00", split_with: ["João"]}
      expect: {ok: true, path: "transaction.purchase.my_share", equals: "55.00"}

