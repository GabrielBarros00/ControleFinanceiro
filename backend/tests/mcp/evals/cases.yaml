# Casos de avaliação da integração MCP (ADR 0035).
#
# Cada caso é um pedido real em linguagem natural e o que se espera de um bom
# agente: quais tools usar, quais NUNCA usar, quantas chamadas no máximo, se deve
# perguntar ao usuário (ambiguidade) e o risco da ação.
#
# `golden` é a trajetória-ouro: a sequência de chamadas que um agente correto faz.
# `test_evals_golden.py` EXECUTA essas trajetórias contra o banco de teste (no
# CI, sem LLM) — prova que o caminho certo funciona e devolve o esperado.
# `scripts/mcp_live_eval.py` roda os mesmos prompts num modelo de verdade e
# compara com `expected_tools` / `forbidden_tools` / `max_calls` (fora do CI).
#
# Placeholders em args: {hoje}, {ontem}, {mes}, {mes_fatura}, {uuid},
# {id:<nome-salvo>} (id capturado por `save` num passo anterior).

- id: gasto-alimentacao-mes
  prompt: "Quanto eu gastei com alimentação este mês?"
  expected_tools: [reports_summary]
  forbidden_tools: [transactions_create, transactions_bulk_delete, reports_show]
  max_calls: 3
  risk: read
  golden:
    - tool: reports_summary
      args: {category: "alimentação"}
      expect: {ok: true, path: "my_categories.0.category", equals: "Alimentação"}

- id: gasolina-nubank
